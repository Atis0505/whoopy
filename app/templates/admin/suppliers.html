{% extends "admin/base_admin.html" %}
{% block content %}
<h1 style="font-family:var(--font-display)">Beszállítók</h1>
<div class="layout-2">
  <div class="panel">
    <table class="table">
      <thead><tr><th>Kód</th><th>Név</th><th>Ország</th><th>E-mail</th></tr></thead>
      <tbody>
      {% for s in suppliers %}
        <tr>
          <td>{{ s.code }}</td>
          <td><strong>{{ s.name }}</strong><div class="muted">{{ s.city }}</div></td>
          <td>{{ s.country }}</td>
          <td>{{ s.email }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
  <div class="panel">
    <h3>Új beszállító</h3>
    <form method="post" action="/admin/suppliers/create">
      <div class="field"><label>Kód</label><input name="code" required placeholder="HU-XYZ-01" /></div>
      <div class="field"><label>Név</label><input name="name" required /></div>
      <div class="field"><label>E-mail</label><input name="email" type="email" /></div>
      <div class="field"><label>Ország</label><input name="country" value="HU" maxlength="2" /></div>
      <div class="field"><label>Város</label><input name="city" /></div>
      <button class="btn" type="submit">Mentés</button>
    </form>
  </div>
</div>
{% endblock %}
